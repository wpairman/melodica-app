[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/stripe/checkout"
  to = "/.netlify/functions/stripe-checkout"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe/verify-session"
  to = "/.netlify/functions/stripe-verify-session"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe/webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
  force = true

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--no-package-lock"
  # Omit NEXT_PUBLIC_FIREBASE_API_KEY from secret scanning
  # This is intentionally public (Firebase client-side API key)
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY"

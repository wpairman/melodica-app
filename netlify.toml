[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--no-package-lock"
  # Omit NEXT_PUBLIC_FIREBASE_API_KEY from secret scanning
  # This is intentionally public (Firebase client-side API key)
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY"
